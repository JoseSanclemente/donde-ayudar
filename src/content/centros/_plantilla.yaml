# Plantilla. Copia este archivo con un nombre kebab-case (ej. `cruz-roja-valle.yaml`),
# llena los datos VERIFICADOS y pon `activo: true`. Con `activo: false` no se dibuja.
# El `_` inicial hace que el loader ignore esta plantilla, así que nunca sale al mapa.
# Lee el README de esta carpeta antes de agregar uno.

# --- Centro de acopio: recibe insumos ---
tipo: acopio
name: Nombre oficial del centro
# OJO: la dirección VA ENTRE COMILLAS. Sin comillas, YAML lee el `#` de la
# nomenclatura como inicio de comentario y guarda solo "Calle 0".
direccion: "Calle 0 # 00-00, Barrio"
lat: 3.4516
lng: -76.532
horario: Lunes a viernes, 8:00 a. m. – 5:00 p. m.
# En `acopio` y `albergue`, no en `sangre`. Ids válidos: herramientas, rescate,
# logistica, bebes, alimentos, salud, voluntarios
recibe: [alimentos]
# En `acopio` y `albergue`. Por defecto true. Con `false` el punto sigue en el mapa
# pero en gris: abierto y sin recibir (bodega llena). Cerrar de verdad es `activo: false`.
recibiendo: true
# Por qué no recibe. Solo se ve con `recibiendo: false`.
# nota_estado: "Bodega llena, reabren el lunes"
telefono: "+57 602 000 0000"
notas: Detalle útil para quien llega (entrada, parqueadero, a quién preguntar).
activo: false
# --- Banco de sangre: mismos campos, pero SIN `recibe` ---
# tipo: sangre
# name: Banco de sangre X
# direccion: "Calle 0 # 00-00, Barrio"
# lat: 3.4516
# lng: -76.532
# horario: 8:00 a. m. – 6:00 p. m.
# activo: false

# --- Albergue: mismos campos que un acopio, incluido `recibe` ---
# tipo: albergue
# name: Albergue X
# direccion: "Calle 0 # 00-00, Barrio"
# lat: 3.4516
# lng: -76.532
# horario: Abierto 24 horas
# recibe: [alimentos, salud, voluntarios]
# recibiendo: true
# activo: false
