# Plantilla. Copia este archivo con un nombre kebab-case (ej. `cruz-roja-valle.yaml`),
# llena los datos VERIFICADOS y pon `activo: true`. Con `activo: false` no se dibuja.
# El `_` inicial hace que el loader ignore esta plantilla, así que nunca sale al mapa.
# Lee el README de esta carpeta antes de agregar uno.

# --- Centro de acopio: recibe insumos ---
tipo: acopio
name: Nombre oficial del centro
# OJO: la dirección VA ENTRE COMILLAS. Sin comillas, YAML lee el `#` de la
# nomenclatura como inicio de comentario y guarda solo "Calle 0".
direccion: "Calle 0 # 00-00, Barrio"
lat: 3.4516
lng: -76.532
horario: Lunes a viernes, 8:00 a. m. – 5:00 p. m.
# Solo en `tipo: acopio`. Ids válidos: herramientas, bebes, alimentos, salud, voluntarios
recibe: [alimentos]
telefono: "+57 602 000 0000"
notas: Detalle útil para quien llega (entrada, parqueadero, a quién preguntar).
activo: false
