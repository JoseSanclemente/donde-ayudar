# Sitio estático: no hay adapter ni funciones. El navegador habla directo con
# Supabase. PUBLIC_SUPABASE_URL y PUBLIC_SUPABASE_ANON_KEY se configuran en
# Site settings -> Environment variables; tienen que existir en build time
# porque Astro las inyecta en el bundle.
#
# Las cabeceras no están acá: la CSP tiene que nombrar el host de Supabase, y
# escrito en este archivo era el mismo dato en dos sitios. Lo genera
# `scripts/headers.mjs` en `dist/_headers`, a partir de la misma variable.
[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"
