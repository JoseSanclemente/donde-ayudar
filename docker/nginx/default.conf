server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Security headers and cache rules — generated at image build time by
    # scripts/build-nginx-headers.mjs from dist/_headers, the same file
    # scripts/headers.mjs writes for Netlify. See that file for why the CSP
    # has to come from PUBLIC_SUPABASE_URL and nowhere else.
    include /etc/nginx/server-headers.conf;
}
